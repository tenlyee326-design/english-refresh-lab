<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#446b52">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Refresh Lab">
  <title>English Refresh Lab</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./app-icon.svg">
  <style>
    :root{--ink:#24362d;--muted:#6e7b73;--line:#dce4dc;--paper:#f7f8f4;--green:#446b52}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 8%,#e9efe4,transparent 30%),var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
    button,textarea{font:inherit}button{cursor:pointer}.top{padding:calc(18px + env(safe-area-inset-top)) 20px 16px;display:flex;align-items:center;gap:10px}.logo{width:36px;height:36px;border-radius:12px;background:var(--green);color:white;display:grid;place-items:center;font-size:18px}.brand{font:700 17px Georgia,serif}
    main{padding:26px 18px;max-width:700px;margin:auto}.date{font-size:10px;font-weight:800;letter-spacing:.14em;color:#7b887f}.hero h1{font:500 42px/1.03 Georgia,serif;letter-spacing:-.035em;margin:12px 0}.hero h1 em{color:var(--green);font-weight:400}.hero p{color:var(--muted);font-size:14px;line-height:1.5}
    .modes{display:grid;gap:13px;margin-top:28px}.mode{border:1px solid rgba(50,70,58,.1);border-radius:22px;padding:23px;text-align:left;min-height:205px;color:var(--ink);position:relative}.mode.quiet{background:linear-gradient(145deg,#dfeadf,#eff3e9)}.mode.speaking{background:linear-gradient(145deg,#f0dcd0,#f6e9df)}.mode.low{background:linear-gradient(145deg,#ded7e6,#eee9ef)}.mode .icon{display:grid;place-items:center;width:43px;height:43px;border-radius:14px;background:#ffffff9c;font-size:21px}.mode small{display:block;margin-top:30px;text-transform:uppercase;letter-spacing:.12em;color:#6f7b73;font-weight:700;font-size:9px}.mode strong{display:block;font:600 28px Georgia,serif;margin:6px 0}.mode p{margin:0;color:#66736b;font-size:13px;line-height:1.5}.mode b{position:absolute;right:20px;top:20px;background:#ffffff80;border-radius:999px;padding:6px 9px;font-size:10px}
    .presence{margin-top:18px;background:white;border:1px solid var(--line);border-radius:19px;padding:19px;display:flex;align-items:center;justify-content:space-between}.presence strong{font:600 18px Georgia,serif}.presence span{color:var(--muted);font-size:11px}.presence b{font:700 24px Georgia,serif;color:var(--green)}
    .nav{position:fixed;bottom:0;left:0;right:0;background:#fffffff2;backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:9px 10px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:8}.nav button{border:0;background:transparent;color:#79857e;font-size:10px;display:grid;gap:3px;place-items:center}.nav button.active{color:var(--green)}
    .sheet{position:fixed;inset:0;background:#f8faf6;z-index:20;overflow:auto;padding-bottom:env(safe-area-inset-bottom)}.hidden{display:none}.sheet header{height:calc(58px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 18px 0;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.sheet header button{border:0;background:none;color:var(--muted)}.session{padding:38px 24px;max-width:640px;margin:auto}.session h2{font:600 34px/1.15 Georgia,serif;margin:8px 0 22px}.session p{font:400 16px/1.7 Georgia,serif;color:#46564d}.session textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:15px;padding:14px;resize:none;background:white}.primary{width:100%;margin-top:18px;border:0;background:var(--ink);color:white;border-radius:999px;padding:14px;font-size:12px;font-weight:700}.phrase{background:white;border:1px solid var(--line);padding:15px;border-radius:14px;margin:10px 0}.phrase strong{font:600 18px Georgia,serif}.phrase span{display:block;font-size:11px;color:var(--muted);margin-top:5px}.done{text-align:center;padding-top:70px}.done .check{margin:auto;width:70px;height:70px;border-radius:50%;background:#deebdf;display:grid;place-items:center;color:var(--green);font-size:30px}
    .library h2{font:600 36px Georgia,serif}.empty,.entry{background:white;border:1px solid var(--line);border-radius:17px;padding:18px;margin:11px 0}.entry small{color:var(--muted)}.install{font-size:11px;text-align:center;color:var(--muted);margin:20px 0}
    @media(min-width:700px){.modes{grid-template-columns:repeat(3,1fr)}.hero h1{font-size:56px}}
  </style>
</head>
<body>
  <header class="top"><span class="logo">✦</span><span class="brand">English Refresh Lab</span></header>
  <main id="view"></main>
  <nav class="nav"><button data-tab="today" class="active">⌂<span>Today</span></button><button data-tab="vocabulary">◫<span>Vocabulary</span></button><button data-tab="notebook">✎<span>Notebook</span></button><button data-tab="progress">↗<span>Progress</span></button></nav>
  <section id="sheet" class="sheet hidden"></section>
  <script>
    const KEY='english-refresh-lab-data-v1';
    let state=JSON.parse(localStorage.getItem(KEY)||'{"sessions":[],"vocabulary":[],"notes":[]}');
    const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
    const modes={quiet:{icon:'▤',title:'Quiet',label:'For focused moments',copy:'Read a small idea, notice useful language, and make it yours.',time:5},speaking:{icon:'◉',title:'Speaking',label:'When you can talk',copy:'React, speak, and retrieve the English that is already in you.',time:10},low:{icon:'☾',title:'Low Energy',label:'Keep English close',copy:'One idea. One expression. One tiny response. That is enough.',time:2}};
    const view=document.querySelector('#view'),sheet=document.querySelector('#sheet');
    function today(){view.className='hero';view.innerHTML='<span class="date">TODAY · A SMALL MOMENT</span><h1>What fits your situation <em>right now?</em></h1><p>No perfect plan needed. Choose the kind of English that fits this moment.</p><div class="modes">'+Object.entries(modes).map(([id,m])=>`<button class="mode ${id}" onclick="openSession('${id}')"><span class="icon">${m.icon}</span><b>${m.time} min</b><small>${m.label}</small><strong>${m.title}</strong><p>${m.copy}</p></button>`).join('')+'</div><div class="presence"><div><strong>English Presence</strong><br><span>Every kind of contact counts</span></div><b>'+new Set(state.sessions.map(x=>x.date.slice(0,10))).size+' days</b></div><p class="install">On iPhone: Safari → Share → Add to Home Screen</p>'}
    function openSession(id){const m=modes[id];sheet.classList.remove('hidden');sheet.innerHTML=`<header><button onclick="closeSheet()">‹ Back</button><strong>${m.title} · ${m.time} min</strong><span></span></header><div class="session">${content(id)}</div>`}
    function content(id){if(id==='quiet')return '<small class="date">PSYCHOLOGY · EVERYDAY LIFE</small><h2>Why familiar places can suddenly feel new</h2><p>We tend to think familiarity makes us stop noticing things. But sometimes a tiny shift in context can make an ordinary place feel new again.</p><p>Taking a different route, sitting in another corner, or explaining a familiar idea to someone else can reset our attention. What matters most is not novelty itself, but the quality of attention we bring.</p><div class="phrase"><strong>stand out</strong><span>to be especially noticeable</span></div><div class="phrase"><strong>what matters most is…</strong><span>a natural way to introduce the key point</span></div><textarea id="answer" placeholder="What stood out to you?"></textarea><button class="primary" onclick="finish(\'quiet\')">Complete session ✓</button>';
      if(id==='speaking')return '<small class="date">REACT · EXPRESS FIRST</small><h2>How’s your week going?</h2><p>Say your answer out loud first. Do not wait for the perfect sentence. Then keep one line here.</p><textarea id="answer" placeholder="My week has been…"></textarea><button class="primary" onclick="finish(\'speaking\')">Finish & refresh ✓</button>';
      return '<small class="date">ONE IDEA · ONE EXPRESSION</small><h2>make room for</h2><p>To deliberately create time or space for something important.</p><div class="phrase"><strong>I’m trying to make room for more unhurried thinking.</strong></div><textarea id="answer" placeholder="What would you like to make room for?"></textarea><button class="primary" onclick="finish(\'low\')">That’s enough for today ✓</button>'}
    function finish(mode){const answer=document.querySelector('#answer')?.value||'';state.sessions.push({mode,duration:modes[mode].time,date:new Date().toISOString(),answer});if(mode==='quiet'&&!state.vocabulary.some(x=>x.expression==='stand out'))state.vocabulary.push({expression:'stand out',meaning:'to be especially noticeable',status:'Reactivating'});if(answer)state.notes.push({content:answer,date:new Date().toISOString()});save();sheet.querySelector('.session').innerHTML='<div class="done"><div class="check">✓</div><small class="date">ENGLISH WAS HERE TODAY</small><h2>Daily session complete</h2><p>You showed up for a real moment with English. That is enough.</p><button class="primary" onclick="closeSheet()">Done for now</button></div>'}
    function closeSheet(){sheet.classList.add('hidden');today()}
    function tab(name){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));if(name==='today')return today();view.className='library';const map={vocabulary:['Words worth keeping close.',state.vocabulary,'No saved expressions yet. Try a Quiet session.'],notebook:['Ideas in your own words.',state.notes,'Your saved thoughts will appear here.'],progress:['Notice what is becoming yours.',state.sessions,'Your first small session starts the story.']};const [title,items,empty]=map[name];view.innerHTML='<span class="date">'+name.toUpperCase()+'</span><h2>'+title+'</h2>'+(items.length?items.slice().reverse().map(x=>`<div class="entry"><strong>${x.expression||x.mode||'Saved thought'}</strong><p>${x.meaning||x.content||x.answer||x.duration+' minutes'}</p><small>${x.status||new Date(x.date).toLocaleDateString()}</small></div>`).join(''):'<div class="empty">'+empty+'</div>')}
    document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));today();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
  </script>
</body>
</html>
